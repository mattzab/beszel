# Fork (mattzab/beszel): builds hub binaries for tags like v0.21.1-mz.1.
name: Fork hub release

on:
  push:
    tags:
      - "v*-mz.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: GoReleaser hub
        uses: goreleaser/goreleaser-action@v7
        with:
          workdir: ./
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config .goreleaser.fork.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
